name: Demo keep-alive

# The public demo (docs/DEMO.md) runs on a free Supabase project, which pauses after a week
# without activity. Signing in and reading one row every three days keeps it awake for visitors.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

env:
  API: https://fuouxthkrnxkserhodqc.supabase.co
  # Public by design: the publishable key ships in the demo's browser bundle, and the demo
  # account's password is printed on the demo login page.
  KEY: sb_publishable_KP1bhzruDVZ2s__eRcMYhg_zxfuxqo8

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in as the demo cashier and read the store
        run: |
          token=$(curl -fsS "$API/auth/v1/token?grant_type=password" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"email":"kasir@demo.warungkasir.test","password":"demo12345"}' | jq -r .access_token)
          curl -fsS "$API/rest/v1/stores?select=name" -H "apikey: $KEY" -H "Authorization: Bearer $token"
